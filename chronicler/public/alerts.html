<!-- /var/www/chronicler/public/alerts.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chronicler • Alerts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/dashboard.css">
  <style>
    .filters { padding:12px; background:#0b0f14; border-bottom:1px solid #1c2434; display:flex; gap:12px; flex-wrap:wrap; }
    .filters select, .filters input {
      padding:8px; border:1px solid #1c2434; border-radius:6px; background:#0f1521; color:#d6e3f3;
    }
    .alerts-table { width:100%; border-collapse:collapse; margin-top:10px; }
    .alerts-table th, .alerts-table td {
      border-bottom:1px solid #1c2434; padding:8px; text-align:left;
    }
    .pager { margin-top:12px; display:flex; gap:10px; }
    .details-panel {
      margin-top:12px; padding:12px; background:#0f1521; border:1px solid #1c2434; border-radius:8px;
    }
    .details-panel pre { white-space:pre-wrap; color:#d6e3f3; }
    .btn.small { padding:4px 8px; font-size:12px; }
  </style>
</head>


<body>

  <!-- Top Nav -->
  <nav class="top-nav">
    <a href="/">Dashboard</a>
    <a href="/correlation.html">Correlation Rules</a>
    <a href="/artifacts.html">Artifacts</a>
    <a class="active" href="/alerts.html">Alerts</a>
    <a href="/logs.html">Logs</a>
    <a href="/reports.html">Reports</a>
    <a href="/clients.html">Clients</a>
    <a href="/users.html">Users</a>
    <a href="/settings.html">Settings</a>

    <div class="noti-wrap" style="margin-left:auto">
      <button id="notiBell" class="bell" aria-label="Notifications">
        <span class="bell-icon">🔔</span>
        <span id="notiBadge" class="badge">0</span>
      </button>
      <div id="notiMenu" class="dropdown hidden" role="menu" aria-hidden="true">
        <div class="dropdown-header">Notifications</div>
        <div id="notiList" class="dropdown-list"></div>
      </div>
    </div>
  </nav>

  <!-- Filters -->
  <div class="filters">
    <select id="fSeverity">
      <option value="">All Severities</option>
      <option value="low">Low</option>
      <option value="mid">Mid</option>
      <option value="high">High</option>
      <option value="critical">Critical</option>
    </select>

    <select id="fType">
      <option value="">All Types</option>
      <option value="correlation">Correlation</option>
      <option value="artifact">Artifact</option>
    </select>

    <select id="fActive">
      <option value="">Active + Ack</option>
      <option value="true">Active Only</option>
      <option value="false">Acked Only</option>
    </select>

    <select id="fHours">
      <option value="0">Any Time</option>
      <option value="1">Last 1 hour</option>
      <option value="6">Last 6 hours</option>
      <option value="12">Last 12 hours</option>
      <option value="24">Last 24 hours</option>
      <option value="168">Last 7 days</option>
    </select>

    <input id="fSearch" placeholder="Search IP / keyword">
    <button class="btn" id="btnFilter">Apply</button>

    <select id="perPage" style="margin-left:auto">
      <option value="25">25 / page</option>
      <option value="50" selected>50 / page</option>
      <option value="100">100 / page</option>
      <option value="250">250 / page</option>
    </select>
  </div>

  <!-- Bulk action bar (hidden until rows are selected) -->
  <div id="alertsBulkBar" style="display:none;align-items:center;gap:8px;padding:8px 12px;
       background:#0e1e2e;border-bottom:1px solid #1c2434;">
    <span id="alertsBulkCount" style="font-size:13px;color:#b8c7dc;"></span>
    <button class="btn small" id="alertsBulkAck">Acknowledge</button>
    <button class="btn small danger" id="alertsBulkDelete">Delete</button>
    <button class="btn small" id="alertsBulkClear">Clear selection</button>
  </div>

  <!-- Table -->
  <div style="padding:12px;">
    <div id="alertsEmpty" class="empty" style="display:none">No alerts found.</div>
    <table class="alerts-table" id="alertsTable">
      <thead>
        <tr>
          <th class="col-cb">
            <input type="checkbox" id="alertsSelectAll" title="Select all">
          </th>
          <th>ID</th>
          <th>Severity</th>
          <th>Type</th>
          <th>IP</th>
          <th>Name</th>
          <th>Count</th>
          <th>Last Seen</th>
          <th>Active</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="pager">
      <button class="btn small" id="prevPage">← Prev</button>
      <span id="pageInfo" style="align-self:center;color:#b8c7dc;"></span>
      <button class="btn small" id="nextPage">Next →</button>
    </div>

    <div id="detailsPanel" class="details-panel" style="display:none;"></div>
  </div>

  <!-- Alert detail modal -->
  <div id="alertModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <span id="alertModalTitle">Alert Detail</span>
        <button id="alertModalClose" class="btn small">✕</button>
      </div>
      <div id="alertModalBody" class="modal-body"></div>
      <div class="modal-footer">
        <button id="alertAckBtn" class="btn primary" disabled>Acknowledge</button>
        <button id="alertDeleteBtn" class="btn danger">Delete</button>
        <button id="alertModalCancel" class="btn">Close</button>
      </div>
    </div>
    <div class="modal-backdrop-overlay"></div>
  </div>

   <script src="/alerts.js"></script>
</body>
</html>
